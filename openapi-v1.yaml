  "/v1/auth/oauth/{provider}/callback":
    get:
      operationId: get_auth_oauth_provider_callback
      tags:
        - "OAuth / SSO"
      summary: "OAuth redirect callback. Exchanges code+state. Desktop typically uses 200 JSON; browser may 302 to redirect_uri with a o"
      description: "OAuth redirect callback. Exchanges code+state. Desktop typically uses 200 JSON; browser may 302 to redirect_uri with a one-time code.\n\nNever return raw provider tokens or provider payload. New users from login intent are email_verified when the provider email is verified.\n\nAuth: public. Roles: none. Idempotent: code is single-use; replay → invalid_state. Idempotency-Key: n/a. Rate-limit bucket: `oauth_callback`."
      parameters:
        - "$ref": "#/components/parameters/XRequestId"
        - name: provider
          in: path
          required: true
          schema:
            type: string
          description: "google | facebook | x"
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: "Provider authorization code"
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: "Must match start-flow state"
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: "Provider error code if the user denied"
        - name: error_description
          in: query
          required: false
          schema:
            type: string
          description: "Provider description; not echoed verbatim to clients beyond stable codes"
      responses:
        200:
          description: "OAuth redirect callback. Exchanges code+state. Desktop typically uses 200 JSON; browser may 302 to redirect_uri with a one-time code."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            X-RateLimit-Limit:
              "$ref": "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: "Echoed/generated req_ correlation id"
                  user:
                    type: object
                    additionalProperties: true
                    description: "Existing or newly provisioned user (email verified if provider asserts email)"
