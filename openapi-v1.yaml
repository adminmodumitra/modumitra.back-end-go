                  created_at: "2026-08-01T10:00:00Z"
                  updated_at: "2026-09-01T00:00:00Z"
                access_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.access.example
                refresh_token: rt_rotating_01j6n8x4k2m9p7q3r5t8
                expires_in: 900
                token_type: Bearer
                organization:
                  id: org_studio9d2e4c6a80
