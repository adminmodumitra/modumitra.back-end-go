              "$ref": "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rate_limited
                  message: "Bucket exhausted; Retry-After present"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
        503:
