components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "15-minute access token. Authorization: Bearer {access_token}"
    webhookHmac:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: "Stripe-style HMAC over the raw body. Fake local adapter uses the same header."
  headers:
    X-Request-Id:
      description: "Echoed or generated request id (req_ prefix)."
      schema:
        type: string
      required: true
    Retry-After:
      description: "Seconds to wait before retrying."
      schema:
        type: integer
        minimum: 1
    X-RateLimit-Limit:
      schema:
        type: integer
    X-RateLimit-Remaining:
      schema:
        type: integer
    X-RateLimit-Reset:
      description: "Unix epoch seconds UTC"
      schema:
        type: integer
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: "Client correlation id. Echoed. Server generates req_ if omitted."
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: "Required or optional per operation. 24h replay window."
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: "Required. 24h replay window. Same key + different body = 409 idempotency_conflict."
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: "Opaque pagination cursor from next_cursor."
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  schemas:
    ErrorObject:
      type: object
      required:
        - code
        - message
        - request_id
      additionalProperties: false
      properties:
        code:
          type: string
          description: "Stable snake_case"
        message:
          type: string
          description: User-facing
        request_id:
          type: string
          examples:
            - req_01j6n8x4k2m9p7q3r5t8
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          "$ref": "#/components/schemas/ErrorObject"
      example:
        error:
          code: not_found
          message: "The requested resource was not found."
          request_id: req_01j6n8x4k2m9p7q3r5t8
          details: {}
    User:
      type: object
      required:
        - id
        - email
        - email_verified
        - display_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: "^usr_"
          examples:
            - usr_ada01f3e8c2b4a90
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: usr_ada01f3e8c2b4a90
        email: "ada@example.com"
        email_verified: true
        display_name: "Ada Lovelace"
        created_at: "2026-08-01T10:00:00Z"
