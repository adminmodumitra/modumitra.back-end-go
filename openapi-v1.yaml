      description: "Stripe (or fake adapter) billing webhook. Raw body. Signature required. Always 200 {received:true} after accept; 401 invalid_signature otherwise.\n\nHandler verifies signature, writes the event + outbox row in one commit, returns 200. Kafka is not invoked in-request. Duplicate event ids return 200 received=true without re-applying side effects (BIL-003).\n\nAuth: webhook HMAC. Roles: n/a (provider). Idempotent: yes (provider event id dedupe; replay-safe). Idempotency-Key: n/a (dedupe by Stripe event id). Rate-limit bucket: `webhooks_billing`."
      parameters:
        - "$ref": "#/components/parameters/XRequestId"
      responses:
        200:
          description: "Stripe (or fake adapter) billing webhook. Raw body. Signature required. Always 200 {received:true} after accept; 401 invalid_signature otherwise."
