  /v1/auth/resend-verification:
    post:
      operationId: post_auth_resend-verification
      tags:
        - Auth
      summary: "Request a new verification email. Always 202. Does not reveal whether the email exists or is already verified."
      description: "Request a new verification email. Always 202. Does not reveal whether the email exists or is already verified.\n\nAuth: public. Roles: none. Idempotent: yes (same email within window is coalesced). Idempotency-Key: optional. Rate-limit bucket: `auth_resend_verification`."
      parameters:
        - "$ref": "#/components/parameters/XRequestId"
        - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        202:
          description: "Request a new verification email. Always 202. Does not reveal whether the email exists or is already verified."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            X-RateLimit-Limit:
              "$ref": "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: "Echoed/generated req_ correlation id"
                  status:
                    type: string
                    description: "Always accepted"
                additionalProperties: true
                required:
                  - request_id
                  - status
                example:
