                    type: string
                    description: "Issued when intent=login"
                  refresh_token:
                    type: string
                    description: "Issued when intent=login"
                  expires_in:
                    type: integer
                    description: "900"
                  token_type:
                    type: string
                    description: Bearer
                  organization:
                    type:
                      - object
                      - "null"
                    additionalProperties: true
                    description: "Primary org if any"
                  linked_provider:
                    type: string
                    description: "Provider id just completed"
                additionalProperties: true
                required:
                  - request_id
                  - user
                  - access_token
                  - refresh_token
                  - expires_in
                  - token_type
                  - organization
                  - linked_provider
                example:
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  user:
                    id: usr_ada01f3e8c2b4a90
                    email: "ada@example.com"
