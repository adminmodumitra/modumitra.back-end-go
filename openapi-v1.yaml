          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            X-RateLimit-Limit:
              "$ref": "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: "Echoed/generated req_ correlation id"
                  status:
                    type: string
                    description: "Always ok when the process can serve this route"
                additionalProperties: true
                required:
                  - request_id
                  - status
                example:
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  status: ok
              example:
                request_id: req_01j6n8x4k2m9p7q3r5t8
                status: ok
