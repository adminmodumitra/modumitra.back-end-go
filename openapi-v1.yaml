                  request_id:
                    type: string
                    description: "Echoed/generated req_ correlation id"
                  user:
                    type: object
                    additionalProperties: true
                    description: "Authenticated user"
                  access_token:
                    type: string
                    description: "JWT; 15 minutes"
                  refresh_token:
