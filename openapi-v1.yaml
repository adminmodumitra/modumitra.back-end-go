  /v1/auth/refresh:
    post:
      operationId: post_auth_refresh
      tags:
        - Auth
      summary: "Rotate refresh token. Reuse of a spent refresh token revokes the entire family and returns 401 token_reuse_detected."
      description: "Rotate refresh token. Reuse of a spent refresh token revokes the entire family and returns 401 token_reuse_detected.\n\nConcurrent refresh of the same token: first wins; loser is treated as reuse → family revoke. Clients must serialize refresh.\n\nAuth: public. Roles: none. Idempotent: no (rotation). Idempotency-Key: n/a. Rate-limit bucket: `auth_refresh`."
      parameters:
        - "$ref": "#/components/parameters/XRequestId"
      responses:
        200:
          description: "Rotate refresh token. Reuse of a spent refresh token revokes the entire family and returns 401 token_reuse_detected."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            X-RateLimit-Limit:
              "$ref": "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: "Echoed/generated req_ correlation id"
                  access_token:
                    type: string
                    description: "JWT; 15 minutes; Authorization: Bearer"
                  refresh_token:
                    type: string
                    description: "Opaque rotating token; 30 days; single-use"
                  expires_in:
                    type: integer
                    description: "Access token lifetime in seconds (900)"
                  token_type:
                    type: string
                    description: "Always Bearer"
                additionalProperties: true
                required:
                  - request_id
                  - access_token
                  - refresh_token
                  - expires_in
                  - token_type
                example:
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  access_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.access.example
                  refresh_token: rt_rotating_01j6n8x4k2m9p7q3r5t9
                  expires_in: 900
                  token_type: Bearer
              example:
                request_id: req_01j6n8x4k2m9p7q3r5t8
                access_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.access.example
                refresh_token: rt_rotating_01j6n8x4k2m9p7q3r5t9
                expires_in: 900
                token_type: Bearer
        401:
          description: "unauthenticated: Refresh token missing, expired, or revoked; token_reuse_detected: Spent refresh token replayed; family revoked"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: unauthenticated
                  message: "Refresh token missing, expired, or revoked"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
        422:
          description: "validation_error: Body or query failed schema/validation"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: validation_error
                  message: "Body or query failed schema/validation"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
        429:
          description: "rate_limited: Bucket exhausted; Retry-After present"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            Retry-After:
              "$ref": "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rate_limited
                  message: "Bucket exhausted; Retry-After present"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
        503:
          description: "service_unavailable: Dependency or process unavailable; safe to retry with backoff"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: service_unavailable
                  message: "Dependency or process unavailable; safe to retry with backoff"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: "Current unexpired refresh token"
              additionalProperties: true
              required:
