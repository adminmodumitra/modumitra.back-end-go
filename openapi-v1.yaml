  /readyz:
    get:
      operationId: get_readyz
      tags:
        - Ops
      summary: "Readiness probe. Returns 200 only if MongoDB ping and critical dependencies succeed."
      description: "Readiness probe. Returns 200 only if MongoDB ping and critical dependencies succeed.\n\nDo not leak Mongo hostnames, replica-set names, or exception text.\n\nAuth: none. Roles: none. Idempotent: yes (GET). Idempotency-Key: n/a. Rate-limit bucket: `ops_ready`."
      parameters:
        - "$ref": "#/components/parameters/XRequestId"
      responses:
        200:
          description: "Readiness probe. Returns 200 only if MongoDB ping and critical dependencies succeed."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            X-RateLimit-Limit:
              "$ref": "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: "Echoed/generated req_ correlation id"
                  status:
                    type: string
                    description: ready
                  checks:
                    type: object
                    additionalProperties: true
                    description: "Named dependency results; values are ok only — never connection strings"
                additionalProperties: true
                required:
                  - request_id
                  - status
                  - checks
                example:
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  status: ready
                  checks:
                    mongodb: ok
              example:
                request_id: req_01j6n8x4k2m9p7q3r5t8
                status: ready
                checks:
                  mongodb: ok
        429:
          description: "rate_limited: Bucket exhausted; Retry-After present"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            Retry-After:
              "$ref": "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rate_limited
                  message: "Bucket exhausted; Retry-After present"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
        503:
          description: "service_unavailable: A required check failed; body uses the shared error envelope, no Mongo internals"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: service_unavailable
                  message: "A required check failed; body uses the shared error envelope, no Mongo internals"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
      security: []
