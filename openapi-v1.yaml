  /v1/auth/register:
    post:
      operationId: post_auth_register
      tags:
        - Auth
      summary: "Create an unverified user. Does not issue tokens. Password hashed with argon2id server-side. Returns 409 email_taken if "
      description: "Create an unverified user. Does not issue tokens. Password hashed with argon2id server-side. Returns 409 email_taken if the email is already registered (desktop needs a distinct UX).\n\nDoes NOT return access_token or refresh_token. Client must verify email then login.\n\nAuth: public. Roles: none. Idempotent: yes, with Idempotency-Key. Idempotency-Key: required. Rate-limit bucket: `auth_register`."
      parameters:
        - "$ref": "#/components/parameters/XRequestId"
        - "$ref": "#/components/parameters/IdempotencyKeyRequired"
      responses:
        201:
          description: "Create an unverified user. Does not issue tokens. Password hashed with argon2id server-side. Returns 409 email_taken if the email is already registered (desktop needs a distinct UX)."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            X-RateLimit-Limit:
              "$ref": "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              "$ref": "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              "$ref": "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: "Echoed/generated req_ correlation id"
                  user:
                    type: object
                    additionalProperties: true
                    description: "Newly created unverified user; no tokens"
                additionalProperties: true
                required:
                  - request_id
                  - user
                example:
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  user:
                    id: usr_ada01f3e8c2b4a90
                    email: "ada@example.com"
                    email_verified: false
                    display_name: "Ada Lovelace"
                    created_at: "2026-09-01T00:00:00Z"
                    updated_at: "2026-09-01T00:00:00Z"
              example:
                request_id: req_01j6n8x4k2m9p7q3r5t8
                user:
                  id: usr_ada01f3e8c2b4a90
                  email: "ada@example.com"
                  email_verified: false
                  display_name: "Ada Lovelace"
                  created_at: "2026-09-01T00:00:00Z"
                  updated_at: "2026-09-01T00:00:00Z"
        401:
          description: "unauthenticated: Missing, expired, or invalid access token"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: unauthenticated
                  message: "Missing, expired, or invalid access token"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
        403:
          description: "forbidden: Authenticated but lacks required role or capability"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: forbidden
                  message: "Authenticated but lacks required role or capability"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
        409:
          description: "email_taken: Email already registered; idempotency_conflict: Idempotency-Key reused with a different request body"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: email_taken
                  message: "Email already registered"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
        422:
          description: "terms_outdated: terms_version or privacy_version is not current; weak_password: Password fails strength or compromised-password screen; validation_error: Body or query failed schema/validation"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: terms_outdated
                  message: "terms_version or privacy_version is not current"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
        429:
          description: "rate_limited: Bucket exhausted; Retry-After present"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
            Retry-After:
              "$ref": "#/components/headers/Retry-After"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: rate_limited
                  message: "Bucket exhausted; Retry-After present"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
        503:
          description: "service_unavailable: Dependency or process unavailable; safe to retry with backoff"
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: service_unavailable
                  message: "Dependency or process unavailable; safe to retry with backoff"
                  request_id: req_01j6n8x4k2m9p7q3r5t8
                  details: {}
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "Valid email; stored lowercase; max 254"
                password:
                  type: string
                  description: "Min 12 chars; never logged; hashed argon2id"
                display_name:
                  type: string
                  description: "1–80 characters"
                terms_version:
                  type: string
                  description: "Must equal current public config terms_version"
                privacy_version:
                  type: string
                  description: "Must equal current public config privacy_version"
              additionalProperties: true
              required:
                - email
                - password
                - display_name
                - terms_version
                - privacy_version
              example:
                email: "ada@example.com"
                password: correct-horse-battery-staple-19
                display_name: "Ada Lovelace"
                terms_version: "2026-06-01"
                privacy_version: "2026-06-01"
            example:
              email: "ada@example.com"
              password: correct-horse-battery-staple-19
              display_name: "Ada Lovelace"
              terms_version: "2026-06-01"
              privacy_version: "2026-06-01"
