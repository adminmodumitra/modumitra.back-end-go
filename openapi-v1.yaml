      summary: "Email/password login. Issues rotating refresh token and 15-minute access token. Does not reveal whether the email exists"
      description: "Email/password login. Issues rotating refresh token and 15-minute access token. Does not reveal whether the email exists.\n\nCreates a session (ses_). Refresh token is stored hashed. Audit event auth.login is written via outbox after commit.\n\nAuth: public. Roles: none. Idempotent: no (new session each success). Idempotency-Key: n/a. Rate-limit bucket: `auth_login`."
      parameters:
        - "$ref": "#/components/parameters/XRequestId"
      responses:
        200:
          description: "Email/password login. Issues rotating refresh token and 15-minute access token. Does not reveal whether the email exists."
