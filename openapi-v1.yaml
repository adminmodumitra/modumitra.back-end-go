      summary: "Liveness probe. Returns 200 if the HTTP process is up. Does not check MongoDB."
      description: "Liveness probe. Returns 200 if the HTTP process is up. Does not check MongoDB.\n\nMust not require auth. Used by load balancers. No PII.\n\nAuth: none. Roles: none. Idempotent: yes (GET). Idempotency-Key: n/a. Rate-limit bucket: `ops_health`."
      parameters:
        - "$ref": "#/components/parameters/XRequestId"
      responses:
        200:
