# Cabinet Studio slice 0 — API + Postgres + tracing stack
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cabinet
      POSTGRES_PASSWORD: cabinet
      POSTGRES_DB: cabinet_studio
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema-v1.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabinet -d cabinet_studio"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: :8080
      APP_ENV: local
      CABINET_CONFIG: /app/configs/cabinet.local.json
      DATASTORE_DRIVER: postgres
      DATABASE_URL: postgres://cabinet:cabinet@postgres:5432/cabinet_studio?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: cabinet-studio-api
      TERMS_VERSION: "2026-06-01"
      PRIVACY_VERSION: "2026-06-01"
      MIN_APP_VERSION: "1.0.0"
      TRIAL_DAYS: "14"
      LOG_LEVEL: info
      BBR_ENABLED: "true"
      BBR_WINDOW_SIZE: 10s
      BBR_BUCKETS: "100"
      BBR_CPU_THRESHOLD: "800"
      KAFKA_ENABLED: "false"
      KAFKA_BROKERS: ""
      KAFKA_CLIENT_ID: cabinet-studio-api
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/loki.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - loki
      - prometheus

volumes:
  pgdata:
